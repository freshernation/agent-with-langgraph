[project]
name = "agent-with-langgraph"
version = "0.1.0"
description = "The course's model layers, the hand-written Desk, and Helpdesk's shop, installed in place."
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm", "desk", "models", "shop"]
